<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VaultGuard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <h1>VaultGuard</h1>
        <p class="status">Manual check: <strong>Active</strong></p>
        <p id="auto-scan-status" class="status muted">Auto-scan: Checking setting...</p>
      </header>

      <section class="analysis-panel" aria-live="polite">
        <div class="field">
          <span class="label">Current Website:</span>
          <strong id="hostname">Checking current tab...</strong>
        </div>

        <div class="field">
          <span class="label">Risk Level:</span>
          <strong id="risk-level" class="risk safe">Safe</strong>
        </div>

        <p id="summary" class="summary">VaultGuard is preparing the local domain analysis.</p>
        <p class="limit-note">VaultGuard checks domain patterns only. It does not prove a page is safe.</p>
        <ul id="reasons" class="reasons"></ul>
      </section>

      <section class="history-panel">
        <div class="mini-header">
          <h2>Recent Checks</h2>
          <div class="mini-actions">
            <button id="open-history" class="text-button" type="button">Open</button>
            <button id="clear-history" class="text-button" type="button">Clear</button>
          </div>
        </div>
        <ol id="history" class="history-list"></ol>
      </section>

      <footer class="popup-footer">
        <button id="report-feedback" class="secondary-button" type="button">Report Feedback</button>
        <button id="open-options" class="settings-button" type="button">Settings</button>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
